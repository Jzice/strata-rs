[workspace]
resolver = "2"
members = [
    "crates/strata-gguf",
    "crates/strata-tokenizer",
    "crates/strata-core",
    "crates/strata-backend-cpu",
    "crates/strata-backend-wgpu",
    "crates/strata-server",
    "crates/strata-cli",
    "crates/strata-installer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/strata-rs/strata-rs"
readme = "README.md"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Deliberately relaxed for this codebase:
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Bit-exact transcriptions of the reference dequantizers and GGUF parsing:
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
enum_glob_use = "allow"
wildcard_imports = "allow"
match_same_arms = "allow"
items_after_statements = "allow"
too_many_lines = "allow"
similar_names = "allow"
many_single_char_names = "allow"
min_ident_chars = "allow"
doc_markdown = "allow"

[workspace.dependencies]
# Internal crates
strata-gguf = { path = "crates/strata-gguf", version = "0.1.0" }
strata-tokenizer = { path = "crates/strata-tokenizer", version = "0.1.0" }
strata-core = { path = "crates/strata-core", version = "0.1.0" }
strata-backend-cpu = { path = "crates/strata-backend-cpu", version = "0.1.0" }
strata-backend-wgpu = { path = "crates/strata-backend-wgpu", version = "0.1.0" }
strata-server = { path = "crates/strata-server", version = "0.1.0" }

# Shared external crates (versions resolved once here)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
memmap2 = "0.9"
half = "2.7"
rayon = "1.12"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
wgpu = "30.0"
clap = { version = "4.6", features = ["derive", "env"] }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.53", features = ["full"] }
tower-http = { version = "0.7", features = ["fs", "cors", "trace"] }
futures-util = "0.3"
reqwest = { version = "0.13", features = ["stream", "json", "rustls"], default-features = false }
sha2 = "0.10"
indicatif = "0.17"
minijinja = { version = "3.0", features = ["json", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
