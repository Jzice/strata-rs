[package]
name = "strata-backend-wgpu"
description = "wgpu compute backend for strata-core (WGSL kernels, Vulkan-first with D3D12 fallback, CPU fallback path)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Enables the wgpu device and WGSL kernels. Off by default so the workspace
# builds and tests without a GPU.
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]

[dependencies]
strata-core = { workspace = true }
strata-gguf = { workspace = true }
strata-backend-cpu = { workspace = true }
tracing.workspace = true
wgpu = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
